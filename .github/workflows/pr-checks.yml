name: PR checks

on: pull_request

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Ruff and pytest
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.5"

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Ruff lint
        run: uv run --no-sync ruff check .

      - name: Ruff format check
        run: uv run --no-sync ruff format --check .

      - name: Prepare vision test models
        run: |
          uv run --no-sync python - <<'PY'
          from presencekit.inference import default_store

          store = default_store()
          for name in ("yunet", "yunet-opencv", "sface"):
              if store.ensure(name) is None:
                  raise SystemExit(f"Could not prepare test model: {name}")
          PY

      - name: Run pytest
        run: uv run --no-sync pytest -q -rs
