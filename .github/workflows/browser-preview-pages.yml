name: Browser preview Pages

on:
  pull_request:
    paths:
      - ".github/workflows/browser-preview-pages.yml"
      - "experiments/browser_poc/**"
      - "presencekit/static/**"
      - "presencekit/inference/models.py"
      - "scripts/fetch_puresound_model.py"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out PresenceKit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out the pinned PureSound SDK and model
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mcw519/PureSound
          ref: aba2962876c8ec8abec7971378d670677e0ec859
          path: artifacts/puresound-upstream
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.13.5'

      - name: Build PureSound Web SDK
        working-directory: artifacts/puresound-upstream/sdk/web
        run: |
          npm ci
          npm run build

      - name: Build the static preview
        run: |
          uv sync --locked
          uv run --no-sync python scripts/fetch_puresound_model.py --from artifacts/puresound-upstream --dest models
          uv run --no-sync python - <<'PY'
          from presencekit.inference.models import ModelStore

          if ModelStore("models").ensure("yunet") is None:
              raise SystemExit("Could not prepare YuNet")
          PY
          uv run --no-sync python experiments/browser_poc/prepare.py --puresound artifacts/puresound-upstream

      - name: Configure GitHub Pages
        if: github.event_name == 'workflow_dispatch'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload the static Pages artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: artifacts/browser-poc/site

  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: browser-preview-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
