[project]
name = "presencekit"
version = "0.14.0"
description = "Detect when conversing users leave: audio VAD + face tracking fusion on ONNX Runtime, as an embeddable SDK with a live web demo"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "presencekit contributors" }]
# The SDK (presencekit.sdk, .inference, .detectors, .core): every neural model runs on ONNX Runtime.
# For a GPU / NPU build, replace onnxruntime with the matching package (onnxruntime-gpu, onnxruntime-qnn, ...).
dependencies = [
    "numpy>=1.24",
    "opencv-python-headless>=4.8,<5",
    "onnxruntime>=1.18",
    "psutil>=5.9",
]

[project.optional-dependencies]
# The web demo (presencekit command): FastAPI + WebSocket server and the browser UI.
web = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
# LiteRT: MoveNet TFLite fallback when the ONNX export is absent, and the SFace TFLite / NPU delegate backend.
litert = ["ai-edge-litert>=2.3.0"]
# PureSound streaming voice isolation (audio_pipeline=puresound), public repo github.com/mcw519/puresound.
puresound = ["puresound-streaming[cpu]; python_version >= '3.12'"]

[project.scripts]
presencekit = "presencekit.server:main"

[dependency-groups]
dev = ["presencekit[web,litert]", "pytest>=7", "httpx>=0.27", "ruff>=0.6", "websockets>=12", "onnx>=1.16"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["presencekit"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E702", "E701", "UP031"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E702", "B007"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.uv]
required-version = ">=0.13.4"
constraint-dependencies = [
    # GHSA-6q48-6c7w-9gw2: remove the compromised emSign trust root.
    "certifi>=2026.10.19",
    # LiteRT 2.3.0 requires this backport unconditionally. The 1.3.1 release
    # excludes Python >=3.11; 1.2.8 supports >=3.8.6,<4 without metadata patches.
    "backports-strenum==1.2.8; python_version >= '3.11'",
]

[tool.uv.sources]
puresound-streaming = { git = "https://github.com/mcw519/puresound.git", subdirectory = "sdk/python", rev = "aba2962876c8ec8abec7971378d670677e0ec859" }
